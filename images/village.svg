<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Vue du village de La Saulsotte, Aube">
  <!-- Ciel -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#4a7cb5"/>
    </linearGradient>
    <linearGradient id="colline1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d5a27"/>
      <stop offset="100%" stop-color="#1a3a15"/>
    </linearGradient>
    <linearGradient id="colline2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a6b33"/>
      <stop offset="100%" stop-color="#2d5a27"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7a3d"/>
      <stop offset="100%" stop-color="#2d5a27"/>
    </linearGradient>
  </defs>

  <!-- Ciel -->
  <rect width="1600" height="900" fill="url(#ciel)"/>

  <!-- Nuages -->
  <ellipse cx="200" cy="120" rx="90" ry="35" fill="white" opacity="0.25"/>
  <ellipse cx="260" cy="110" rx="70" ry="28" fill="white" opacity="0.22"/>
  <ellipse cx="800" cy="90" rx="110" ry="38" fill="white" opacity="0.2"/>
  <ellipse cx="870" cy="80" rx="80" ry="30" fill="white" opacity="0.18"/>
  <ellipse cx="1350" cy="130" rx="95" ry="32" fill="white" opacity="0.2"/>
  <ellipse cx="1420" cy="120" rx="65" ry="25" fill="white" opacity="0.18"/>

  <!-- Collines arrière-plan -->
  <ellipse cx="400" cy="580" rx="500" ry="200" fill="#2d5a27" opacity="0.7"/>
  <ellipse cx="1200" cy="600" rx="550" ry="210" fill="#2d5a27" opacity="0.65"/>
  <ellipse cx="800" cy="560" rx="600" ry="190" fill="#3a6b33" opacity="0.5"/>

  <!-- Sol / prairie -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#sol)"/>
  <ellipse cx="800" cy="620" rx="900" ry="80" fill="#4a7a3d"/>

  <!-- Route -->
  <path d="M700 900 L750 650 L850 650 L900 900 Z" fill="#8a7a60" opacity="0.6"/>
  <line x1="800" y1="650" x2="800" y2="900" stroke="#c8b88a" stroke-width="4" stroke-dasharray="20,15" opacity="0.5"/>

  <!-- Mairie — bâtiment principal -->
  <rect x="680" y="470" width="240" height="160" fill="#d4c4a0"/>
  <rect x="680" y="470" width="240" height="5" fill="#b8a880"/>
  <!-- Toit mairie -->
  <polygon points="660,470 800,390 940,470" fill="#8b3a2a"/>
  <!-- Fenêtres mairie -->
  <rect x="710" y="510" width="40" height="50" fill="#2a4a6a" rx="3"/>
  <rect x="770" y="510" width="40" height="50" fill="#2a4a6a" rx="3"/>
  <rect x="830" y="510" width="40" height="50" fill="#2a4a6a" rx="3"/>
  <rect x="890" y="510" width="40" height="50" fill="#2a4a6a" rx="3"/>
  <!-- Porte mairie -->
  <rect x="770" y="570" width="60" height="60" fill="#5a3a1a" rx="4"/>
  <circle cx="800" cy="600" r="4" fill="#c8a840"/>
  <!-- Drapeau -->
  <line x1="800" y1="340" x2="800" y2="390" stroke="#888" stroke-width="2"/>
  <rect x="800" y="340" width="30" height="20" fill="#002395"/>
  <rect x="810" y="340" width="10" height="20" fill="white"/>
  <rect x="820" y="340" width="10" height="20" fill="#ED2939"/>

  <!-- Clocher église (gauche) -->
  <rect x="430" y="490" width="100" height="140" fill="#c8b8a0"/>
  <!-- Toit église -->
  <polygon points="420,490 480,420 540,490" fill="#7a2a1a"/>
  <!-- Croix -->
  <rect x="476" y="400" width="8" height="25" fill="#888"/>
  <rect x="470" y="408" width="20" height="5" fill="#888"/>
  <!-- Fenêtre ogivale église -->
  <path d="M462 510 Q480 490 498 510 L498 545 L462 545 Z" fill="#2a4a6a"/>
  <!-- Horloge -->
  <circle cx="480" cy="475" r="18" fill="#f0e8d0" stroke="#8a7a60" stroke-width="2"/>
  <line x1="480" y1="475" x2="480" y2="460" stroke="#444" stroke-width="2"/>
  <line x1="480" y1="475" x2="492" y2="478" stroke="#444" stroke-width="2"/>

  <!-- Maisons (droite) -->
  <!-- Maison 1 -->
  <rect x="1050" y="530" width="130" height="110" fill="#c8b8a0"/>
  <polygon points="1040,530 1115,470 1190,530" fill="#8b3a2a"/>
  <rect x="1075" y="565" width="35" height="40" fill="#5a3a1a" rx="2"/>
  <rect x="1120" y="555" width="30" height="30" fill="#2a4a6a" rx="2"/>

  <!-- Maison 2 -->
  <rect x="1210" y="545" width="110" height="100" fill="#d8c8a8"/>
  <polygon points="1200,545 1265,490 1330,545" fill="#7a4a2a"/>
  <rect x="1230" y="580" width="30" height="35" fill="#5a3a1a" rx="2"/>
  <rect x="1270" y="570" width="25" height="28" fill="#2a4a6a" rx="2"/>

  <!-- Maison 3 (petite, fond gauche) -->
  <rect x="300" y="555" width="100" height="95" fill="#c0b098"/>
  <polygon points="292,555 350,500 408,555" fill="#8b3a2a"/>
  <rect x="320" y="590" width="25" height="32" fill="#5a3a1a" rx="2"/>
  <rect x="355" y="578" width="22" height="24" fill="#2a4a6a" rx="2"/>

  <!-- Arbres (gauche) -->
  <rect x="235" y="580" width="12" height="60" fill="#5a3a1a"/>
  <ellipse cx="241" cy="565" rx="28" ry="35" fill="#2d5a27"/>
  <rect x="175" y="590" width="10" height="50" fill="#5a3a1a"/>
  <ellipse cx="180" cy="575" rx="22" ry="28" fill="#3a6b33"/>

  <!-- Arbres (droite) -->
  <rect x="1390" y="575" width="12" height="55" fill="#5a3a1a"/>
  <ellipse cx="1396" cy="560" rx="26" ry="33" fill="#2d5a27"/>
  <rect x="1450" y="580" width="10" height="50" fill="#5a3a1a"/>
  <ellipse cx="1455" cy="565" rx="22" ry="28" fill="#3a6b33"/>

  <!-- Arbres (milieu, derrière mairie) -->
  <rect x="615" y="550" width="10" height="80" fill="#5a3a1a"/>
  <ellipse cx="620" cy="535" rx="22" ry="28" fill="#2d5a27"/>
  <rect x="970" y="545" width="10" height="85" fill="#5a3a1a"/>
  <ellipse cx="975" cy="530" rx="22" ry="30" fill="#3a6b33"/>

  <!-- Champs (texture lignes) -->
  <line x1="0" y1="680" x2="600" y2="680" stroke="#3a6a2a" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="700" x2="600" y2="700" stroke="#3a6a2a" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="720" x2="600" y2="720" stroke="#3a6a2a" stroke-width="2" opacity="0.3"/>
  <line x1="1000" y1="680" x2="1600" y2="680" stroke="#3a6a2a" stroke-width="2" opacity="0.3"/>
  <line x1="1000" y1="700" x2="1600" y2="700" stroke="#3a6a2a" stroke-width="2" opacity="0.3"/>
  <line x1="1000" y1="720" x2="1600" y2="720" stroke="#3a6a2a" stroke-width="2" opacity="0.3"/>
</svg>
