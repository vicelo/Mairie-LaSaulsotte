# ─── Sveltia CMS — Mairie de La Saulsotte ───────────────────────────────────
#
# Interface d'administration du contenu, accessible sur /admin.
# Elle écrit directement dans le dépôt GitHub : chaque publication déclenche
# un nouveau déploiement du site.
#
# Authentification : la connexion se fait avec un compte GitHub ayant accès
# au dépôt. Aucun serveur à héberger — Sveltia utilise le service OAuth par
# défaut. Pour s'en affranchir, déployer sveltia-cms-auth sur Cloudflare
# Workers (gratuit) et renseigner son URL dans `base_url` ci-dessous.

backend:
  name: github
  repo: vicelo/Mairie-LaSaulsotte
  branch: main
  # base_url: https://sveltia-cms-auth.<sous-domaine>.workers.dev

# Développement local : décommenter, puis lancer `npx @sveltia/cms-server`.
# Le CMS écrit alors dans les fichiers du disque sans passer par GitHub.
# local_backend: true

# ─── Médias ──────────────────────────────────────────────────────────────────

media_folder: public/images/uploads
public_folder: /images/uploads

# ─── Interface ───────────────────────────────────────────────────────────────

# Pas d'option `locale` : Sveltia l'ignore et suit la langue du navigateur.
# Pré-production. À basculer sur https://lasaulsotte.fr lors de la mise en ligne.
site_url: https://vicelo.github.io/Mairie-LaSaulsotte
display_url: https://vicelo.github.io/Mairie-LaSaulsotte

# ─── Collections ─────────────────────────────────────────────────────────────

collections:
  # ── Annonces (bandeau défilant en page d'accueil) ──────────────────────────
  - name: annonces
    label: Annonces (bandeau accueil)
    label_singular: Annonce
    folder: content/annonces
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{texte}}"
    sortable_fields: [ordre]
    fields:
      - label: Texte de l'annonce
        name: texte
        widget: string
        hint: Message court affiché dans le bandeau défilant (150 caractères max)

      - label: Lien
        name: lien
        widget: string
        required: false
        hint: "Page vers laquelle pointe l'annonce, ex. /actualites/mon-article. Laisser vide si aucun."

      - label: Date de début d'affichage
        name: dateDebut
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        required: false
        hint: L'annonce n'apparaîtra qu'à partir de cette date. Vide = tout de suite.

      - label: Date de fin d'affichage
        name: dateFin
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        required: false
        hint: Dernier jour d'affichage. L'annonce disparaît ensuite toute seule. Vide = pas d'expiration.

      - label: Ordre d'affichage
        name: ordre
        widget: number
        value_type: int
        default: 1
        hint: Les plus petits nombres passent en premier dans le bandeau.

  # ── Actualités ─────────────────────────────────────────────────────────────
  - name: actualites
    label: Actualités
    label_singular: Actualité
    folder: content/actualites
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "/actualites/{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - label: Titre
        name: title
        widget: string
        hint: Titre affiché en page d'accueil et dans la liste des actualités

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        default: "{{now}}"

      - label: Catégorie
        name: category
        widget: select
        options:
          - Vie municipale
          - Travaux
          - Environnement
          - Culture
          - Social
          - Autres

      - label: Résumé
        name: excerpt
        widget: text
        hint: Court résumé affiché dans les cartes et les listes (150 caractères max)

      - label: Image principale
        name: image
        widget: image
        required: false
        hint: Image illustrant l'actualité (format paysage recommandé, 1200×630 px)
        media_folder: /public/images/uploads/actualites
        public_folder: /images/uploads/actualites

      - label: Contenu
        name: body
        widget: markdown
        hint: Contenu complet de l'actualité

  # ── Conseil municipal ──────────────────────────────────────────────────────
  - name: elus
    label: Conseil municipal
    label_singular: Élu
    folder: content/elus
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{ordre}}. {{nom}} — {{fonction}}"
    sortable_fields: [ordre, nom]
    fields:
      - label: Nom et prénom
        name: nom
        widget: string
        hint: "Exemple : Michelle Monos"

      - label: Fonction
        name: fonction
        widget: select
        options:
          - Maire
          - 1re adjointe
          - 1er adjoint
          - 2e adjointe
          - 2e adjoint
          - 3e adjointe
          - 3e adjoint
          - 4e adjointe
          - 4e adjoint
          - Conseillère municipale
          - Conseiller municipal

      - label: Ordre d'affichage
        name: ordre
        widget: number
        value_type: int
        default: 10
        hint: 1 pour le maire, puis les adjoints, puis les conseillers.

      - label: Commission ou délégation
        name: delegation
        widget: string
        required: false
        hint: "Facultatif. Exemple : « Voirie et bâtiments communaux »."

  # ── Hébergements touristiques ──────────────────────────────────────────────
  - name: hebergements
    label: Hébergements
    label_singular: Hébergement
    folder: content/hebergements
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{nom}} — {{type}}"
    sortable_fields: [ordre, nom]
    fields:
      - label: Nom de l'hébergement
        name: nom
        widget: string

      - label: Type
        name: type
        widget: select
        options:
          - Meublé de tourisme
          - Chambres d'hôtes
          - Gîte
          - Camping
          - Autre

      - label: Description
        name: description
        widget: text
        hint: Quelques phrases de présentation. Rester factuel et de longueur comparable d'un hébergement à l'autre.

      - label: Adresse
        name: adresse
        widget: string
        required: false

      - label: Capacité (nombre de personnes)
        name: capacite
        widget: number
        value_type: int
        required: false

      - label: Téléphone
        name: telephone
        widget: string
        required: false

      - label: Lien de réservation ou site
        name: lien
        widget: string
        required: false
        hint: Adresse complète commençant par https://

      - label: Ordre d'affichage
        name: ordre
        widget: number
        value_type: int
        default: 10
        hint: À valeur égale, les hébergements sont classés par ordre alphabétique.

  # ── Démarches administratives ───────────────────────────────────────────────
  - name: demarches
    label: Démarches
    label_singular: Démarche
    folder: content/demarches
    create: true
    delete: true
    slug: "{{fields.id}}"
    summary: "{{title}} ({{category}})"
    sortable_fields: [title, category]
    fields:
      - label: Identifiant (slug)
        name: id
        widget: string
        hint: Identifiant unique sans espace ni accent (ex. acte-naissance)
        pattern: ["^[a-z0-9-]+$", "Minuscules, chiffres et tirets uniquement"]

      - label: Titre
        name: title
        widget: string

      - label: Description
        name: description
        widget: text
        hint: Description courte affichée dans la liste des démarches

      - label: Catégorie
        name: category
        widget: select
        options:
          - État civil
          - Urbanisme
          - Élections
          - Social
          - Autres

      - label: Délai de traitement
        name: delai
        widget: string
        required: false
        hint: "Exemple : 5 à 10 jours ouvrés"

      - label: Documents requis
        name: documents
        widget: list
        required: false
        hint: Liste des pièces justificatives à fournir
        field:
          label: Document
          name: item
          widget: string

      - label: Lien externe
        name: lienExterne
        widget: string
        required: false
        hint: URL service-public.fr ou autre référence externe

      - label: Contenu détaillé
        name: body
        widget: markdown
        required: false
        hint: Informations complémentaires (procédure détaillée, formulaires, etc.)
